      desc:{ en:'Silence no longer equals success. AI declares task_plan with steps, advances via task_step_done, and closes with task_complete or task_fail. Timeouts and bridge drops are captured as real failures — side panel shows live progress.', zh:'沉默不再等于成功。AI 用 task_plan 声明步骤，通过 task_step_done 推进，最后以 task_complete 或 task_fail 收尾。超时和 Bridge 掉线均被捕获为真实失败 — 侧边栏实时显示进度。', ja:'沈黙はもはや成功を意味しません。AIはtask_planでステップを宣言し、task_step_doneで進め、task_completeまたはtask_failで完了します。タイムアウトとBridge切断は本当の失敗として記録 — サイドパネルがライブ進捗を表示。', ko:'침묵이 더 이상 성공을 의미하지 않습니다. AI는 task_plan으로 단계를 선언하고 task_step_done으로 진행하며 task_complete 또는 task_fail로 완료합니다. 타임아웃과 브리지 끊김은 실제 실패로 기록 — 사이드 패널이 실시간 진행 상황 표시.', es:'El silencio ya no equivale al éxito. La IA declara task_plan con pasos, avanza con task_step_done y cierra con task_complete o task_fail. Los tiempos de espera y desconexiones se capturan como fallos reales.', fr:'Le silence ne signifie plus le succès. L\'IA déclare task_plan avec des étapes, avance via task_step_done et conclut avec task_complete ou task_fail. Les délais et déconnexions sont capturés comme de vraies erreurs.', de:'Stille bedeutet nicht mehr Erfolg. KI deklariert task_plan mit Schritten, schreitet via task_step_done voran und beendet mit task_complete oder task_fail. Timeouts und Bridge-Abbrüche werden als echte Fehler erfasst.', pt:'Silêncio não significa mais sucesso. IA declara task_plan com etapas, avança via task_step_done e finaliza com task_complete ou task_fail. Timeouts e desconexões são capturados como falhas reais.', ru:'Молчание больше не равно успеху. ИИ объявляет task_plan с шагами, продвигается через task_step_done и завершает task_complete или task_fail. Таймауты и отключения моста — реальные ошибки.', ar:'الصمت لم يعد يعني النجاح. يعلن الذكاء الاصطناعي task_plan بالخطوات، يتقدم عبر task_step_done، ويختتم بـ task_complete أو task_fail. انتهاء المهلة وقطع الاتصال يُسجَّلان كإخفاقات حقيقية.', it:'Il silenzio non significa più successo. L\'IA dichiara task_plan con i passi, avanza tramite task_step_done e chiude con task_complete o task_fail. Timeout e disconnessioni vengono catturati come veri errori.', hi:'चुप्पी अब सफलता नहीं है। AI task_plan से स्टेप्स घोषित करता है, task_step_done से आगे बढ़ता है, और task_complete या task_fail से बंद करता है। टाइमआउट और ब्रिज डिसकनेक्ट वास्तविक विफलताओं के रूप में कैप्चर होते हैं।' },
