<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentLimb</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>

  <!-- ═══ 未配对：唯一职责 = 复制提示词 ═══ -->
  <section id="state-unpaired" class="state">
    <div class="hero">
      <img src="../../icons/icon.svg" class="hero-logo" alt="">
      <h1 class="hero-title">连接 AI 到浏览器</h1>
      <p class="hero-sub">复制下面的提示词，粘贴给你的智能体软件。<br>它会自动接入 MCP 并请求配对。</p>
    </div>

    <button id="btn-copy-prompt" class="btn-primary">复制连接提示词</button>
    <div id="copy-feedback" class="copy-feedback" hidden>已复制 — 去粘贴给 AI 吧</div>

    <p class="panel-hint">连接成功后就不需要一直开着侧边栏：侧栏与 AI 运行无关，只在首次配对和聊天时用到，随时可以关掉。</p>

    <div id="pending-box" class="pending-box" hidden>
      <div class="pending-title">等待配对确认</div>
      <div id="pending-detail" class="pending-detail"></div>
      <div class="pending-hint">配对标签页已自动打开；如果误关了，重新复制提示词让 AI 再连一次。</div>
    </div>

    <div id="bridge-offline" class="bridge-offline" hidden>
      本地桥接未运行 — 请先在 AI 中配置并启动 AgentLimb MCP。
    </div>

    <details class="advanced">
      <summary>高级：MCP 命令路径</summary>
      <p class="advanced-hint">安装脚本默认把 MCP 主机放在 <code>~/.agentlimb/</code>。如自定义了位置，在此修改（写入复制出的提示词）：</p>
      <input id="input-host-path" type="text" spellcheck="false" placeholder="~/.agentlimb/mcp-server.mjs">
      <button id="btn-save-path" class="btn-ghost">保存</button>
    </details>
  </section>

  <!-- ═══ 已配对：就是 AI 的聊天窗，眼前这一页它默认看得见 ═══ -->
  <section id="state-paired" class="state state-chat" hidden>
    <header class="chat-header">
      <div id="client-chips" class="client-chips"></div>
      <button id="btn-disconnect" class="btn-link" title="断开后需要重新配对">断开</button>
    </header>

    <div id="chat-log" class="chat-log"></div>

    <form id="chat-form" class="chat-form">
      <textarea id="chat-input" rows="1" placeholder="问它当前页面的事，或让它去做点什么…" autocomplete="off"></textarea>
      <button type="submit" class="btn-send" title="发送（Enter，Shift+Enter 换行）">发送</button>
    </form>
    <div id="page-note" class="chat-note">它会自动看到你当前标签页的内容</div>
  </section>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
