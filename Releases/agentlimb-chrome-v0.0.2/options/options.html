<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title data-i18n="aboutTitle">AgentLimb - About</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f0f0f;
      --bg2:     #1a1a1a;
      --bg3:     #252525;
      --border:  #2e2e2e;
      --text:    #e8e8e8;
      --muted:   #888;
      --accent:  #5b9cf6;
      --success: #4caf82;
      --danger:  #e05c5c;
      --radius:  8px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      line-height: 1.6;
      padding: 32px 24px;
      max-width: 480px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .page-header h1 { font-size: 18px; font-weight: 700; }
    .version {
      font-size: 11px;
      color: var(--muted);
      background: var(--bg3);
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--muted); }
    .info-value { color: var(--text); font-weight: 500; }

    .desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 16px;
    }

    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }
    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: var(--muted);
    }
    .feature-item .feat-icon { flex-shrink: 0; }
    .feature-item .feat-text { line-height: 1.5; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="page-header">
  <h1><img src="../icons/icon.svg" style="width:24px;height:24px;vertical-align:middle;margin-right:6px" alt="">AgentLimb</h1>
  <span class="version" id="ext-version">v2.1.0</span>
</div>

<div class="card">
  <div class="card-title" data-i18n="about"></div>
  <p class="desc" data-i18n="aboutDesc">
  </p>
  <div class="feature-list">
    <div class="feature-item">
      <span class="feat-icon">🤖</span>
      <span class="feat-text" data-i18n="featureAI"></span>
    </div>
    <div class="feature-item">
      <span class="feat-icon"><img src="../icons/icon.svg" style="width:14px;height:14px" alt=""></span>
      <span class="feat-text" data-i18n="featureSkills"></span>
    </div>
    <div class="feature-item">
      <span class="feat-icon">⏰</span>
      <span class="feat-text" data-i18n="featureSchedule"></span>
    </div>
    <div class="feature-item">
      <span class="feat-icon">🔌</span>
      <span class="feat-text" data-i18n="featureMCP"></span>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title" data-i18n="versionInfo"></div>
  <div class="info-row">
    <span class="info-label" data-i18n="extensionVersion"></span>
    <span class="info-value" id="display-version">2.1.0</span>
  </div>
  <div class="info-row">
    <span class="info-label" data-i18n="architecture"></span>
    <span class="info-value" data-i18n="architectureValue"></span>
  </div>
  <div class="info-row">
    <span class="info-label" data-i18n="bridgePort"></span>
    <span class="info-value">127.0.0.1:7789</span>
  </div>
  <div class="info-row">
    <span class="info-label" data-i18n="skillStorage"></span>
    <span class="info-value" data-i18n="skillStorageValue"></span>
  </div>
</div>

<div class="card">
  <div class="card-title">Links</div>
  <div class="info-row" style="cursor:pointer" onclick="window.open('https://agentlimb.com')">
    <span class="info-label">🌐</span>
    <span class="info-value"><a href="https://agentlimb.com" style="color:var(--accent)">agentlimb.com</a></span>
  </div>
  <div class="info-row" style="cursor:pointer" onclick="window.open('https://github.com/hooosberg/AgentLimb')">
    <span class="info-label">📦</span>
    <span class="info-value"><a href="https://github.com/hooosberg/AgentLimb" style="color:var(--accent)">GitHub</a></span>
  </div>
  <div class="info-row" style="cursor:pointer" onclick="window.open('https://agentlimb.com/privacy.html')">
    <span class="info-label">🔒</span>
    <span class="info-value"><a href="https://agentlimb.com/privacy.html" style="color:var(--accent)" data-i18n="linkPrivacy"></a></span>
  </div>
  <div class="info-row" style="cursor:pointer" onclick="window.open('https://agentlimb.com/license.html')">
    <span class="info-label">📄</span>
    <span class="info-value"><a href="https://agentlimb.com/license.html" style="color:var(--accent)" data-i18n="linkLicense"></a></span>
  </div>
</div>

<script type="module" src="options.js"></script>
</body>
</html>
