name: CI

on:
  push:
    branches: [lite, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Protocol + unit tests (no browser needed)
        run: npm test
      - name: Validate extension manifest
        run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) process.exit(1); if(m.default_locale) { console.error('default_locale set but no _locales shipped'); process.exit(1); }"

  windows-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse Windows PowerShell 5.1 scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Run tests on Windows
        # bash expands the tests/*.test.mjs glob. Going through npm would spawn
        # cmd.exe, which passes the pattern to node literally (and Node 20's
        # test runner does not glob it itself).
        shell: bash
        run: node --test --test-force-exit --test-concurrency=1 tests/*.test.mjs
