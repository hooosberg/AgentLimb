name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: npm test
      - name: Package extension zip (loadable in chrome://extensions)
        run: |
          mkdir -p dist
          zip -r dist/agentlimb-chrome.zip \
            manifest.json package.json README.md \
            kernel host bin scripts ui icons assets \
            -x '*.DS_Store'
          cd dist && sha256sum agentlimb-chrome.zip > SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/agentlimb-chrome.zip dist/SHA256SUMS.txt --clobber
