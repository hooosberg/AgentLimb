name: Windows 兼容性实测

# 只在专门的分支 / 手动触发时跑，不干扰主 CI。
# 目的：拿到真实 Windows 上的结论 —— 单测通过率、Edge/Chrome 能否加载扩展并连上桥接、
# 中文+空格路径、install 与桥接探测。
on:
  push:
    branches: [test/windows-compat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 环境基线
        run: node scripts/windows-compat-test.mjs env
        continue-on-error: true

      - name: 单元测试（Windows）
        shell: bash
        run: node --test --test-force-exit --test-concurrency=1 tests/*.test.mjs
        continue-on-error: true

      - name: 浏览器加载实测（Edge / Chrome）
        run: node scripts/windows-compat-test.mjs browsers
        continue-on-error: true

      # 同一批路径，改用命令行 --load-extension 再加载一遍。
      # 目的：区分「Windows 浏览器本身不认中文路径」和「CDP 的 UTF-8 路径转码出错」——
      # 前者说明用户走图形界面也装不上，后者说明只有自动化通道受影响，课件口径完全不同。
      - name: 路径变体（命令行加载方式交叉验证）
        env:
          AGENTLIMB_STRATEGY: flag
        run: node scripts/windows-compat-test.mjs pathsonly
        continue-on-error: true

      - name: 安装与桥接实测
        run: node scripts/windows-compat-test.mjs install
        continue-on-error: true

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-compat-report
          path: windows-compat-report-*.json
          if-no-files-found: warn
